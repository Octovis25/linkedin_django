{% extends "core/base.html" %}
{% block title %}Invite new user{% endblock %}
{% block content %}
<h1>Invite new user</h1>
<p style="margin-bottom:1.5rem; color:#555;">The new user automatically receives an email with their login details.</p>
<div class="card" style="max-width:500px;">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>First name</label>
      <input type="text" name="first_name" placeholder="e.g. Anna" />
    </div>
    <div class="form-group">
      <label>Last name</label>
      <input type="text" name="last_name" placeholder="e.g. Miller" />
    </div>
    <div class="form-group">
      <label>Email address *</label>
      <input type="text" name="email" placeholder="anna.miller@example.com" required />
    </div>
    <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
      <input type="checkbox" name="is_staff" id="is_staff" style="width:auto;" />
      <label for="is_staff" style="margin:0;">Staff rights (can manage other users)</label>
    </div>
    <div style="display:flex; gap:1rem; margin-top:1.5rem;">
      <button type="submit" class="btn btn-primary">Invite & send email</button>
      <a href="/users/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
