{% extends "core/base.html" %}
{% block title %}Data import{% endblock %}
{% block content %}
<div class="card">
    <h2>Start data import</h2>
    <p style="margin-bottom: 1rem;">Processes all uploaded files and imports them into the database.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-secondary">Start import</button>
    </form>
</div>

{% if log %}
<div class="card">
    <h3>Import log</h3>
    <div style="background: #f5f5f5; padding: 1rem; border-radius: 6px; font-family: monospace; font-size: 0.85rem;">
        {% for line in log %}
        <div>{{ line }}</div>
        {% endfor %}
    </div>
</div>
{% endif %}
{% endblock %}
