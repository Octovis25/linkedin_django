{% extends "core/base.html" %}
{% block title %}Delete post{% endblock %}
{% block content %}
<div style="max-width:500px"><div class="card">
<h2>Really delete?</h2>
<p style="margin-bottom:1rem;color:var(--octo-muted)">Post <strong style="color:var(--octo-white)">{{ post.post_id }}</strong> from <strong style="color:var(--octo-white)">{{ post.post_date }}</strong> will be permanently deleted.</p>
<form method="post">{% csrf_token %}
<div style="display:flex;gap:.5rem">
<button type="submit" class="btn btn-danger">Yes, delete</button>
<a href="{% url 'posts_posted:list' %}" class="btn btn-secondary">Cancel</a>
</div></form></div></div>
{% endblock %}
