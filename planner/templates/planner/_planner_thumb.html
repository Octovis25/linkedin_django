<td style="width:46px;padding:6px 4px 6px 14px">
  {% if p.image %}
    <img class="pt-thumb" src="/planner/image/{{ p.id }}/?v={% now 'U' %}"
         onclick="event.stopPropagation();openLightbox('/planner/image/{{ p.id }}/?v={% now 'U' %}')">
  {% elif p.video_nc_path %}
    {% if p.video_nc_path|slice:'-4:'|lower == '.gif' %}
    <img class="pt-thumb" title="GIF" src="/library/studio/nc-image/?p={{ p.video_nc_path|urlencode }}"
         onclick="event.stopPropagation();openLightbox('/library/studio/nc-image/?p={{ p.video_nc_path|urlencode }}')">
    {% elif 'Studio_Work' in p.video_nc_path %}
    <video class="pt-thumb" muted preload="metadata" playsinline title="Video"
           data-vthumb="/library/studio/nc-image/?p={{ p.video_nc_path|urlencode }}"></video>
    {% else %}
    <video class="pt-thumb" muted preload="metadata" playsinline title="Video"
           data-vthumb="/planner/nc-video-preview/{{ p.video_nc_path|cut:'Marketing & Design/LinkedIn/Planner/Videos/'|urlencode }}/"></video>
    {% endif %}
  {% else %}
    <div class="pt-thumb pt-thumb-ph" style="background:{{ accent }}20;color:{{ accent }}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>
    </div>
  {% endif %}
</td>
