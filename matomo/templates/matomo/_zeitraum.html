<form class="mt-filter" method="get">
  <div class="form-group">
    <label for="von">From</label>
    <input type="date" name="von" id="von" value="{{ von }}">
  </div>
  <div class="form-group">
    <label for="bis">To</label>
    <input type="date" name="bis" id="bis" value="{{ bis }}">
  </div>
  {% if zeige_limit %}
  <div class="form-group">
    <label for="limit">Rows</label>
    <input type="number" name="limit" id="limit" value="{{ limit }}" min="10" max="1000" step="10">
  </div>
  {% endif %}
  {% if zeige_nur %}
  <div class="form-group">
    <label for="nur">Show</label>
    <select name="nur" id="nur">
      <option value="alle" {% if nur == 'alle' %}selected{% endif %}>all</option>
      <option value="menschen" {% if nur == 'menschen' %}selected{% endif %}>humans only</option>
      <option value="bots" {% if nur == 'bots' %}selected{% endif %}>bots only</option>
    </select>
  </div>
  {% endif %}
  {% if mitnehmen_tag %}<input type="hidden" name="tag" value="{{ mitnehmen_tag }}">{% endif %}
  {% if mitnehmen_stunde %}<input type="hidden" name="stunde" value="{{ mitnehmen_stunde }}">{% endif %}
  <button type="submit" class="btn btn-primary">Show</button>
</form>
{% if hinweis %}<div class="alert alert-info">{{ hinweis }}</div>{% endif %}
